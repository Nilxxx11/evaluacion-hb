<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registros de evaluaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--ink:#13213c;--muted:#63718b;--line:#dce6f4;--blue:#195bb9;--bg:#f4f7fc;--card:#fff;--green:#087b48;--amber:#a46300;--red:#bd2e39}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#dceaff 0,transparent 27%),var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}.bar{background:linear-gradient(110deg,#102e6a,#185dbb 65%,#11743b);min-height:74px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;color:#fff;box-shadow:0 4px 18px #15366b42}.eyebrow{margin:0 0 3px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c8ddff}.bar h1{margin:0;font:700 19px 'Syne',sans-serif}.status{font-size:12px;color:#e3efff}.main{max-width:1280px;margin:auto;padding:38px 20px 64px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.heading h2{font:800 28px 'Syne',sans-serif;margin:0}.heading p{color:var(--muted);margin:7px 0 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #1b4c8b0d;padding:22px}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px}.search{flex:1;position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 39px;font:inherit;color:var(--ink);outline:none;background:#fbfdff}.search:before{content:'⌕';position:absolute;left:14px;top:7px;font-size:22px;color:var(--muted)}.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #195bb91c}.button{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:700 12px 'DM Sans';padding:11px 15px;cursor:pointer}.button:hover{color:var(--blue);border-color:var(--blue);background:#f4f8ff}.summary{display:flex;gap:10px;color:var(--muted);font-size:12px;margin:0 0 14px}.summary strong{color:var(--ink)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:830px}th{text-align:left;padding:11px 12px;background:#edf4ff;color:#1852a0;font-size:10px;letter-spacing:.07em;text-transform:uppercase}td{padding:13px 12px;border-bottom:1px solid #e9eff8;color:#40516c}tr:hover td{background:#f8fbff}.name{font-weight:700;color:var(--ink)}.pill{font-weight:700;font-size:11px;border-radius:999px;padding:4px 9px;display:inline-block}.high{background:#e4f7ed;color:var(--green)}.mid{background:#fff3dc;color:var(--amber)}.low{background:#ffeaeb;color:var(--red)}.empty{text-align:center;padding:42px;color:var(--muted)}@media(max-width:650px){.bar{padding:16px}.main{padding:25px 12px}.heading{display:block}.toolbar{align-items:stretch;flex-direction:column}.card{padding:14px}.heading h2{font-size:23px}}
.pdf{padding:7px 10px;font-size:11px;color:#195bb9;border-color:#b9d0f4}.pdf:hover{background:#edf5ff}</style></head>
<body>
<header class="bar"><div><p class="eyebrow">Talento Humano · FT-TH-009</p><h1>Registros de evaluaciones</h1></div><span class="status" id="status">● Conectando…</span></header>
<main class="main"><div class="heading"><div><h2>Evaluaciones guardadas</h2><p>Consulta, filtra y descarga el consolidado de evaluaciones.</p></div></div><section class="card"><div class="toolbar"><label class="search"><input id="query" placeholder="Buscar por nombre, cédula, cargo o evaluador" autocomplete="off"></label><button class="button" id="export">Descargar Excel</button></div><p class="summary" id="summary">Cargando registros…</p><div class="table-wrap"><table><thead><tr><th>Evaluado</th><th>Cédula</th><th>Cargo</th><th>Tipo</th><th>Evaluador</th><th>Fecha</th><th>Resultado</th><th>Acción</th></tr></thead><tbody id="rows"><tr><td class="empty" colspan="8">Conectando con los registros…</td></tr></tbody></table></div></section></main>
<script>
let records=[];
const byId=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function render(){
  const q=byId('query').value.trim().toLowerCase();
  const list=records.filter(r=>[r.nombre,r.cedula,r.cargo,r.evaluador,r.nivelLabel].some(v=>String(v||'').toLowerCase().includes(q)));
  byId('summary').innerHTML='<strong>'+list.length+'</strong> de '+records.length+' registros cargados';
  if(!list.length){byId('rows').innerHTML='<tr><td class="empty" colspan="8">No se encontraron registros.</td></tr>';return}
  byId('rows').innerHTML=list.map(r=>{const pct=Number(r.resultado)||0,cl=pct>=75?'high':pct>=50?'mid':'low';return '<tr><td class="name">'+esc(r.nombre)+'</td><td>'+esc(r.cedula)+'</td><td>'+esc(r.cargo)+'</td><td>'+esc(r.nivelLabel)+'</td><td>'+esc(r.evaluador)+'</td><td>'+esc(r.fecha)+'</td><td><span class="pill '+cl+'">'+pct+'%</span></td><td><button class="button pdf" data-pdf="'+esc(r.key)+'">PDF</button></td></tr>'}).join('');
}
function exportXlsx(){if(!records.length)return;const values=[['Nombre','Cédula','Cargo','Tipo','Evaluador','Fecha','Período','Resultado (%)','Puntaje','Máximo'],...records.map(r=>[r.nombre,r.cedula,r.cargo,r.nivelLabel,r.evaluador,r.fecha,r.periodo,r.resultado,r.puntajeTotal,r.puntajeMaximo])];const ws=XLSX.utils.aoa_to_sheet(values);ws['!cols']=[{wch:28},{wch:16},{wch:24},{wch:35},{wch:28},{wch:13},{wch:18},{wch:14},{wch:12},{wch:12}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Registros');XLSX.writeFile(wb,'Evaluaciones_'+new Date().toISOString().slice(0,10)+'.xlsx')}
function downloadPdf(key){
  // El generador de index.html es la fuente única del formato oficial del PDF.
  window.open('index.html?pdf='+encodeURIComponent(key),'_blank','noopener');
}
async function loadRecords(){
  try{const base=String(FIREBASE_CONFIG.databaseURL).replace(/\/$/,'');const response=await fetch(base+'/evaluaciones.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();records=Object.entries(data||{}).map(([key,value])=>({key,...value}));records.sort((a,b)=>String(b.creadoEn||'').localeCompare(String(a.creadoEn||'')));byId('status').textContent='● Conectado · '+records.length+' registros';render()}catch(e){byId('status').textContent='● Error de conexión';byId('rows').innerHTML='<tr><td class="empty" colspan="8">No fue posible cargar los registros.</td></tr>';byId('summary').textContent='Error al cargar registros.'}}
byId('query').addEventListener('input',render);byId('export').addEventListener('click',exportXlsx);byId('rows').addEventListener('click',e=>{const btn=e.target.closest('[data-pdf]');if(btn)downloadPdf(btn.dataset.pdf)});loadRecords();
</script></body></html>
